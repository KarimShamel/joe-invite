<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="Watch Video">
    <meta property="og:description" content="Watch the video">
    <meta property="og:image" content="joe1.jpg">
    <meta property="og:type" content="video.other">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Video</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>

    <div class="video-container">
        <video
            id="video"
            controls
            autoplay
            playsinline
            preload="auto"
            poster="joe1.jpg"
        >
            <source src="joe.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <script>
        const video = document.getElementById("video");

        // Try to enter fullscreen when the video starts.
        video.addEventListener("play", async () => {
            try {
                if (document.fullscreenElement) return;

                if (video.requestFullscreen) {
                    await video.requestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
            } catch (error) {
                // Some mobile browsers require a user interaction
                // before allowing fullscreen.
            }
        });
    </script>

</body>
</html>
